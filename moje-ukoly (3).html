<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>4fin | Moje úkoly</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg:#0d0f14; --surface:#151820; --surface2:#1c2030; --border:#252a3a;
    --accent:#c8a96e; --accent2:#e8c98e; --green:#4caf82; --red:#e05252;
    --yellow:#e0a832; --blue:#5b8dee;
    --text:#e8eaf0; --text2:#8892a4; --text3:#555f72;
    --radius:12px; --mono:'JetBrains Mono',monospace; --sans:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .logo{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:0.08em;font-weight:500;}
  .logo span{color:var(--text3);}
  .shell{max-width:520px;margin:0 auto;padding:28px 20px 80px;}

  .greeting{font-size:20px;font-weight:700;margin-bottom:4px;}
  .subgreeting{font-size:13px;color:var(--text2);margin-bottom:24px;}

  .ukol-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px 18px;margin-bottom:14px;transition:border-color 0.2s;}
  .ukol-card.done{border-color:rgba(76,175,130,0.4);background:rgba(76,175,130,0.05);}
  .ukol-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
  .ukol-cas{font-family:var(--mono);font-size:12px;color:var(--accent);flex-shrink:0;margin-top:2px;}
  .ukol-nazev{font-size:15px;font-weight:600;color:var(--text);flex:1;}

  .check-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer;user-select:none;}
  .checkbox{width:24px;height:24px;border-radius:7px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
  .checkbox.checked{background:var(--green);border-color:var(--green);}
  .checkbox.checked::after{content:'✓';color:#0d0f14;font-size:14px;font-weight:700;}
  .check-label{font-size:14px;color:var(--text);font-weight:500;}

  .narocnost-wrap{display:none;}
  .narocnost-wrap.show{display:block;}
  .narocnost-label{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;}
  .narocnost-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .nar-btn{border:1.5px solid var(--border);background:var(--surface2);border-radius:8px;padding:10px 6px;text-align:center;cursor:pointer;transition:all 0.15s;font-size:12px;color:var(--text2);}
  .nar-btn .emoji{font-size:18px;display:block;margin-bottom:4px;}
  .nar-btn.sel-lehke{border-color:var(--green);background:rgba(76,175,130,0.12);color:var(--green);}
  .nar-btn.sel-stredni{border-color:var(--yellow);background:rgba(224,168,50,0.12);color:var(--yellow);}
  .nar-btn.sel-tezke{border-color:var(--red);background:rgba(224,82,82,0.12);color:var(--red);}

  .stav-hotovo{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green);margin-top:4px;}

  .btn-primary{width:100%;background:var(--accent);color:#0d0f14;border:none;border-radius:10px;font-family:var(--sans);font-size:15px;font-weight:700;padding:14px;cursor:pointer;margin-top:8px;transition:background 0.15s;}
  .btn-primary:hover{background:var(--accent2);}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}

  .empty{text-align:center;padding:60px 20px;color:var(--text3);}
  .empty-icon{font-size:40px;margin-bottom:14px;}

  .loading{text-align:center;padding:60px 20px;color:var(--text3);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--green);color:#0d0f14;padding:14px 24px;border-radius:10px;font-weight:700;font-size:14px;transition:transform 0.3s;z-index:200;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .master-lock{position:fixed;inset:0;background:#0d0f14;z-index:9999;display:flex;align-items:center;justify-content:center;}
  .master-lock-box{background:#151820;border:1px solid #252a3a;border-radius:14px;padding:32px 28px;max-width:340px;width:90%;text-align:center;}
  .master-lock-box .lock-icon{font-size:32px;margin-bottom:12px;}
  .master-lock-box h2{font-size:16px;color:#e8eaf0;margin:0 0 6px;}
  .master-lock-box p{font-size:12px;color:#8892a4;margin:0 0 18px;line-height:1.5;}
  .master-lock-box input{width:100%;background:#1c2030;border:1.5px solid #252a3a;border-radius:8px;color:#e8eaf0;font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:0.3em;text-align:center;padding:12px;outline:none;margin-bottom:12px;}
  .master-lock-box input:focus{border-color:#c8a96e;}
  .master-lock-box button{width:100%;background:#c8a96e;color:#0d0f14;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;}
  .master-lock-box .lock-msg{font-size:12px;color:#e05252;margin-top:10px;min-height:16px;}
</style>
</head>
<body>
<header>
  <div class="logo">4fin <span>//</span> Moje úkoly</div>
</header>

<div class="shell">
  <div id="content">
    <div class="loading">Načítám dnešní úkoly…</div>
  </div>
</div>

<div class="toast" id="toast">✅ Uloženo, díky!</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyqnJsAlmzOAntypivM5oiLt8twpNJkJrUaK4D-rkvQPzFC_btwUrC8ivasYrnWbdsM6g/exec?token=6696d0e4ae4d7f0d73530fbd67961aeb2d823f69';

function getParam(name){
  const params = new URLSearchParams(window.location.search);
  return params.get(name) || '';
}

const novacekId = getParam('id');
let ukolyData = null;
const vybraneNarocnosti = {}; // ukolId -> 'lehke'|'stredni'|'tezke'
const zaskrtnute = {}; // ukolId -> true/false

async function nacti(){
  if(!novacekId){
    document.getElementById('content').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Chybí identifikátor v odkazu.<br>Zkus otevřít odkaz znovu z e-mailu.</div>';
    return;
  }
  try{
    const resp = await fetch(SCRIPT_URL+'&action=getNovacekUkoly&novacekId=' + encodeURIComponent(novacekId));
    const data = await resp.json();
    ukolyData = data;
    render();
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Nepodařilo se načíst úkoly.<br>Zkus obnovit stránku.</div>';
  }
}

function render(){
  const el = document.getElementById('content');
  if(ukolyData.error){
    el.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>' + esc(ukolyData.error) + '</div>';
    return;
  }
  if(!ukolyData.ukoly || !ukolyData.ukoly.length){
    el.innerHTML = '<div class="greeting">Ahoj' + (ukolyData.novacek ? ', ' + esc(ukolyData.novacek.split(',')[0]) : '') + '!</div>' +
      '<div class="empty"><div class="empty-icon">🎉</div>Na dnešek nemáš v diáři žádný úkol ze zapracování.<br>Užij si den!</div>';
    return;
  }

  let html = '<div class="greeting">Ahoj, ' + esc((ukolyData.novacek||'').split(',')[0]) + '!</div>' +
    '<div class="subgreeting">Tvoje úkoly na dnešek (' + esc(ukolyData.datum||'') + ')</div>';

  ukolyData.ukoly.forEach(function(u){
    const jeHotovo = u.hotovo;
    zaskrtnute[u.ukolId] = jeHotovo;
    if(u.obtiznost) vybraneNarocnosti[u.ukolId] = u.obtiznost;

    html += '<div class="ukol-card ' + (jeHotovo?'done':'') + '" id="card-' + u.ukolId + '">' +
      '<div class="ukol-top">' +
        '<div class="ukol-cas">' + esc(u.cas) + '</div>' +
        '<div class="ukol-nazev">' + esc(u.nazev) + '</div>' +
      '</div>';

    if(jeHotovo){
      html += '<div class="stav-hotovo">✅ Označeno jako splněno' + (u.obtiznost ? ' · ' + narocnostEmoji(u.obtiznost) : '') + '</div>';
    } else {
      html += '<div class="check-row" onclick="toggleCheck(\'' + u.ukolId + '\')">' +
        '<div class="checkbox" id="chk-' + u.ukolId + '"></div>' +
        '<div class="check-label">Splnil/a jsem tento úkol</div>' +
      '</div>' +
      '<div class="narocnost-wrap" id="nar-' + u.ukolId + '">' +
        '<div class="narocnost-label">Jak ti to šlo?</div>' +
        '<div class="narocnost-grid">' +
          '<div class="nar-btn" id="nb-' + u.ukolId + '-lehke" onclick="setNarocnost(\'' + u.ukolId + '\',\'lehke\')"><span class="emoji">🟢</span>Lehké</div>' +
          '<div class="nar-btn" id="nb-' + u.ukolId + '-stredni" onclick="setNarocnost(\'' + u.ukolId + '\',\'stredni\')"><span class="emoji">🟡</span>Přiměřené</div>' +
          '<div class="nar-btn" id="nb-' + u.ukolId + '-tezke" onclick="setNarocnost(\'' + u.ukolId + '\',\'tezke\')"><span class="emoji">🔴</span>Těžké</div>' +
        '</div>' +
        '<button class="btn-primary" id="btn-' + u.ukolId + '" disabled onclick="odeslat(\'' + u.ukolId + '\')">Odeslat</button>' +
      '</div>';
    }
    html += '</div>';
  });

  el.innerHTML = html;
}

function narocnostEmoji(n){
  if(n==='lehke') return '🟢 Lehké';
  if(n==='stredni') return '🟡 Přiměřené';
  if(n==='tezke') return '🔴 Těžké';
  return '';
}

function toggleCheck(ukolId){
  const chk = document.getElementById('chk-'+ukolId);
  const nar = document.getElementById('nar-'+ukolId);
  const jeChecked = chk.classList.toggle('checked');
  if(jeChecked){
    nar.classList.add('show');
  } else {
    nar.classList.remove('show');
    vybraneNarocnosti[ukolId] = null;
    document.querySelectorAll('#nar-'+ukolId+' .nar-btn').forEach(b=>b.className='nar-btn');
    document.getElementById('btn-'+ukolId).disabled = true;
  }
}

function setNarocnost(ukolId, hodnota){
  vybraneNarocnosti[ukolId] = hodnota;
  ['lehke','stredni','tezke'].forEach(function(n){
    const btn = document.getElementById('nb-'+ukolId+'-'+n);
    btn.className = 'nar-btn' + (n===hodnota ? ' sel-'+n : '');
  });
  document.getElementById('btn-'+ukolId).disabled = false;
}

async function odeslat(ukolId){
  const obtiznost = vybraneNarocnosti[ukolId];
  if(!obtiznost) return;
  const btn = document.getElementById('btn-'+ukolId);
  btn.disabled = true;
  btn.textContent = 'Odesílám…';

  try{
    await fetch(SCRIPT_URL, {
      method:'POST',
      body: JSON.stringify({
        action:'oznamSplneniUkolu',
        novacekId: novacekId,
        ukolId: ukolId,
        obtiznost: obtiznost
      })
    });
    showToast();
    const card = document.getElementById('card-'+ukolId);
    card.classList.add('done');
    const narWrap = document.getElementById('nar-'+ukolId);
    const checkRow = card.querySelector('.check-row');
    narWrap.remove();
    checkRow.remove();
    const stav = document.createElement('div');
    stav.className = 'stav-hotovo';
    stav.innerHTML = '✅ Označeno jako splněno · ' + narocnostEmoji(obtiznost);
    card.appendChild(stav);
  }catch(e){
    btn.disabled = false;
    btn.textContent = 'Odeslat';
    alert('Nepodařilo se odeslat, zkus to prosím znovu.');
  }
}

function showToast(){
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

nacti();
</script>
</body>
</html>
