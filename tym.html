<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4fin | Tým</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --bg:#0d0f14; --surface:#151820; --surface2:#1c2030; --border:#252a3a;
    --text:#e8eaf0; --text2:#8892a4; --text3:#555f72;
    --accent:#c8a96e; --green:#4caf82; --red:#e05252; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface);}
  .topbar a{color:var(--text2);text-decoration:none;font-size:13px;}
  .topbar .title{font-family:var(--mono);color:var(--accent);font-size:13px;letter-spacing:0.05em;}
  .topbar .clock{font-family:var(--mono);color:var(--text3);font-size:12px;}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px;}
  h1{font-size:22px;margin:0 0 6px;}
  .sub{color:var(--text2);font-size:13px;margin-bottom:24px;line-height:1.6;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;padding:6px 8px;border-bottom:1px solid var(--border);}
  td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle;}
  input[type=text],input[type=email],select{
    background:var(--surface2);border:1.5px solid var(--border);border-radius:6px;color:var(--text);
    font-family:'Inter',sans-serif;font-size:13px;padding:6px 8px;width:100%;outline:none;
  }
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
  .btn{background:var(--accent);color:var(--bg);border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
  .btn.danger{background:rgba(224,82,82,0.15);color:var(--red);border:1px solid rgba(224,82,82,0.3);}
  .btn:hover{opacity:0.85;}
  .row-actions{display:flex;gap:6px;}
  .add-form{display:grid;grid-template-columns:1.4fr 1.4fr 1fr 1fr 1.2fr auto;gap:10px;align-items:end;}
  .add-form label{display:block;font-size:11px;color:var(--text3);margin-bottom:4px;}
  .chk-cell{text-align:center;}
  .status-msg{font-size:12px;color:var(--green);margin-top:8px;min-height:16px;}
  .inactive-row{opacity:0.45;}
  @media (max-width:700px){
    .add-form{grid-template-columns:1fr 1fr;}
    table, thead, tbody, th, td, tr{display:block;}
    thead{display:none;}
    tr{border-bottom:2px solid var(--border);padding:10px 0;}
    td{border:none;padding:4px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;}
    td::before{content:attr(data-label);color:var(--text3);font-size:11px;flex-shrink:0;}
  }
</style>
</head>
<body>
  <div class="topbar">
    <a href="index.html">← 4fin OS</a>
    <div class="title">4fin // Tým</div>
    <div class="clock" id="clock"></div>
  </div>
  <div class="wrap">
    <h1>Správa týmu</h1>
    <div class="sub">Jediný zdroj pravdy pro to, kdo se objeví ve výběru "Kdo jsi?" a "Kdo je tvůj nadřízený?" ve všech trenažérech. Změny se projeví okamžitě — není potřeba nic nahrávat ani upravovat kód.</div>

    <div class="card" id="loginCard">
      <div style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:14px;text-transform:uppercase;letter-spacing:0.05em;font-size:11px;">Přihlášení</div>
      <div class="add-form" style="grid-template-columns:1fr 1fr auto;">
        <div>
          <label>Kdo jsi?</label>
          <select id="loginSelect"></select>
        </div>
        <div>
          <label>Tvůj PIN</label>
          <input type="password" id="loginPin" inputmode="numeric" maxlength="6" placeholder="123456">
        </div>
        <div>
          <button class="btn" onclick="prihlasit()">Přihlásit se</button>
        </div>
      </div>
      <div class="status-msg" id="loginMsg"></div>
    </div>

    <div id="spravaObsah" style="display:none;">
    <div class="card">
      <table id="tymTable">
        <thead>
          <tr>
            <th>Jméno</th>
            <th>Email</th>
            <th style="text-align:center;">Aktivní</th>
            <th style="text-align:center;">Nadřízený</th>
            <th>Podléhá</th>
            <th>Zámek</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tymBody"></tbody>
      </table>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="card">
      <div style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:14px;text-transform:uppercase;letter-spacing:0.05em;font-size:11px;">Přidat novou osobu</div>
      <div class="add-form">
        <div>
          <label>Jméno</label>
          <input type="text" id="newJmeno" placeholder="Jméno Příjmení">
        </div>
        <div>
          <label>Email</label>
          <input type="email" id="newEmail" placeholder="jmeno.prijmeni@4fin.cz">
        </div>
        <div class="chk-cell">
          <label>Aktivní</label>
          <input type="checkbox" id="newAktivni" checked>
        </div>
        <div class="chk-cell">
          <label>Nadřízený</label>
          <input type="checkbox" id="newJeNadrizeny">
        </div>
        <div>
          <label>Podléhá</label>
          <select id="newManazer"></select>
        </div>
        <div>
          <label>PIN (nepovinné)</label>
          <input type="text" id="newPin" inputmode="numeric" maxlength="6" placeholder="ponech prázdné = vygenerovat">
        </div>
        <div>
          <button class="btn" onclick="pridatOsobu()">+ Přidat</button>
        </div>
      </div>
    </div>
    </div>
  </div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyqnJsAlmzOAntypivM5oiLt8twpNJkJrUaK4D-rkvQPzFC_btwUrC8ivasYrnWbdsM6g/exec?token=6696d0e4ae4d7f0d73530fbd67961aeb2d823f69';
let TYM = [];
let prihlasenPersonId = '';
let prihlasenPin = '';

function updateClock(){
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
}

async function loadTym(){
  try{
    const res = await fetch(SCRIPT_URL + '&action=getTym');
    TYM = await res.json();
    if(!Array.isArray(TYM)) TYM = [];
  }catch(e){ console.log('Chyba načtení týmu:', e); TYM = []; }
  renderLoginSelect();
  render();
}

function renderLoginSelect(){
  const sel = document.getElementById('loginSelect');
  if(!sel) return;
  const aktivni = TYM.filter(p=>p.aktivni);
  sel.innerHTML = '<option value="">-- Vyber své jméno --</option>' +
    aktivni.map(p=>`<option value="${p.personId}">${p.jmeno}</option>`).join('');
}

async function prihlasit(){
  const personId = document.getElementById('loginSelect').value;
  const pin = document.getElementById('loginPin').value.trim();
  if(!personId || !pin){ document.getElementById('loginMsg').textContent = 'Vyber jméno a zadej PIN.'; return; }
  document.getElementById('loginMsg').textContent = 'Ověřuji...';
  try{
    const res = await fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'prihlaseni', personId, pin })
    });
    const data = await res.json();
    if(data.ok){
      prihlasenPersonId = personId;
      prihlasenPin = pin;
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('spravaObsah').style.display = 'block';
    } else {
      document.getElementById('loginMsg').textContent = 'Špatné jméno nebo PIN.';
    }
  }catch(e){ document.getElementById('loginMsg').textContent = 'Chyba připojení.'; console.log(e); }
}

function nadrizeniOptions(selectedJmeno){
  const nadrizeni = TYM.filter(p=>p.jeNadrizeny);
  let html = '<option value="">— žádný —</option>';
  html += nadrizeni.map(p=>`<option value="${p.jmeno}"${p.jmeno===selectedJmeno?' selected':''}>${p.jmeno}</option>`).join('');
  return html;
}

function render(){
  const tbody = document.getElementById('tymBody');
  tbody.innerHTML = TYM.map((p,i)=>`
    <tr class="${p.aktivni?'':'inactive-row'}" data-idx="${i}">
      <td data-label="Jméno"><input type="text" value="${p.jmeno}" onchange="updateField(${i},'jmeno',this.value)"></td>
      <td data-label="Email"><input type="email" value="${p.email}" onchange="updateField(${i},'email',this.value)"></td>
      <td data-label="Aktivní" class="chk-cell"><input type="checkbox" ${p.aktivni?'checked':''} onchange="updateField(${i},'aktivni',this.checked)"></td>
      <td data-label="Nadřízený" class="chk-cell"><input type="checkbox" ${p.jeNadrizeny?'checked':''} onchange="updateField(${i},'jeNadrizeny',this.checked)"></td>
      <td data-label="Podléhá"><select onchange="updateManazer(${i},this)">${nadrizeniOptions(p.manazerJmeno)}</select></td>
      <td data-label="Zámek">${p.uzamceno?'<span style="color:var(--red);font-weight:700;">🔒 uzamčeno</span>':'<span style="color:var(--text3);">—</span>'}</td>
      <td>
        <div class="row-actions">
          <button class="btn secondary" onclick="ulozitOsobu(${i})">Uložit</button>
          ${p.uzamceno?'<button class="btn" onclick="odemknout(\''+p.personId+'\')">Odemknout</button>':''}
          <button class="btn danger" onclick="smazatOsobu(${i})">Smazat</button>
        </div>
      </td>
    </tr>
  `).join('');
  document.getElementById('newManazer').innerHTML = nadrizeniOptions('');
}

async function odemknout(personId){
  setStatus('Odemykám...');
  try{
    await fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'odemknoutOsobu', personId, auth_personId: prihlasenPersonId, auth_pin: prihlasenPin })
    });
    setStatus('Odemčeno.');
    await loadTym();
  }catch(e){ setStatus('Chyba při odemykání'); console.log(e); }
}

function updateField(i, field, value){
  TYM[i][field] = value;
}

function updateManazer(i, sel){
  const jmeno = sel.value;
  const match = TYM.find(p=>p.jmeno===jmeno);
  TYM[i].manazerJmeno = jmeno;
  TYM[i].manazerEmail = match ? match.email : '';
}

async function ulozitOsobu(i){
  const p = TYM[i];
  setStatus('Ukládám...');
  try{
    await fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'saveTymOsoba', ...p, auth_personId: prihlasenPersonId, auth_pin: prihlasenPin })
    });
    setStatus('Uloženo — ' + p.jmeno);
    await loadTym();
  }catch(e){ setStatus('Chyba při ukládání'); console.log(e); }
}

async function smazatOsobu(i){
  const p = TYM[i];
  if(!confirm(`Opravdu natrvalo smazat ${p.jmeno} ze seznamu? (Pokud jen odešel/odešla z firmy, doporučujeme místo toho vypnout "Aktivní" a uložit.)`)) return;
  setStatus('Mažu...');
  try{
    await fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'smazTymOsobu', personId: p.personId, auth_personId: prihlasenPersonId, auth_pin: prihlasenPin })
    });
    setStatus('Smazáno — ' + p.jmeno);
    await loadTym();
  }catch(e){ setStatus('Chyba při mazání'); console.log(e); }
}

async function pridatOsobu(){
  const jmeno = document.getElementById('newJmeno').value.trim();
  const email = document.getElementById('newEmail').value.trim();
  const aktivni = document.getElementById('newAktivni').checked;
  const jeNadrizeny = document.getElementById('newJeNadrizeny').checked;
  const manazerSel = document.getElementById('newManazer');
  const manazerJmeno = manazerSel.value;
  const manazerMatch = TYM.find(p=>p.jmeno===manazerJmeno);
  const pin = document.getElementById('newPin').value.trim();

  if(!jmeno){ setStatus('Zadej prosím jméno.'); return; }

  setStatus('Přidávám...');
  try{
    await fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({
        action:'saveTymOsoba', jmeno, email, aktivni, jeNadrizeny, pin,
        manazerJmeno: manazerJmeno, manazerEmail: manazerMatch ? manazerMatch.email : '',
        auth_personId: prihlasenPersonId, auth_pin: prihlasenPin
      })
    });
    document.getElementById('newJmeno').value='';
    document.getElementById('newEmail').value='';
    document.getElementById('newAktivni').checked=true;
    document.getElementById('newJeNadrizeny').checked=false;
    document.getElementById('newPin').value='';
    setStatus('Přidáno — ' + jmeno);
    await loadTym();
  }catch(e){ setStatus('Chyba při přidávání'); console.log(e); }
}

function setStatus(msg){
  document.getElementById('statusMsg').textContent = msg;
}

document.addEventListener('DOMContentLoaded', () => {
  updateClock();
  setInterval(updateClock, 30000);
  loadTym();
});
</script>
</body>
</html>
