<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4fin | Moje realitní schůzky</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --bg:#0d0f14; --surface:#151820; --surface2:#1c2030; --border:#252a3a;
    --text:#e8eaf0; --text2:#8892a4; --text3:#555f72;
    --accent:#c8a96e; --green:#4caf82; --red:#e05252; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface);}
  .topbar .title{font-family:var(--mono);color:var(--accent);font-size:13px;letter-spacing:0.05em;}
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px;}
  h1{font-size:20px;margin:0 0 6px;}
  .sub{color:var(--text2);font-size:13px;margin-bottom:22px;line-height:1.6;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .c-name{font-size:16px;font-weight:700;margin-bottom:4px;}
  .c-meta{font-size:12px;color:var(--text2);margin-bottom:3px;line-height:1.6;}
  .c-note{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0;line-height:1.6;}
  .row{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .row-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;}
  .btn-group{display:flex;gap:8px;}
  .btn-toggle{flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;text-align:center;}
  .btn-toggle.selected-yes{background:rgba(76,175,130,0.2);border-color:var(--green);color:var(--green);}
  .btn-toggle.selected-no{background:rgba(224,82,82,0.2);border-color:var(--red);color:var(--red);}
  textarea, input[type=number]{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:9px 10px;outline:none;margin-top:8px;}
  textarea{min-height:50px;resize:vertical;}
  .save-btn{background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:11px 20px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:14px;}
  .save-btn:hover{opacity:0.85;}
  .status-line{font-size:11px;color:var(--text3);margin-top:8px;min-height:14px;}
  .empty{text-align:center;color:var(--text2);padding:60px 20px;font-size:14px;line-height:1.7;}
  .master-lock{position:fixed;inset:0;background:#0d0f14;z-index:9999;display:flex;align-items:center;justify-content:center;}
  .master-lock-box{background:#151820;border:1px solid #252a3a;border-radius:14px;padding:32px 28px;max-width:340px;width:90%;text-align:center;}
  .master-lock-box .lock-icon{font-size:32px;margin-bottom:12px;}
  .master-lock-box h2{font-size:16px;color:#e8eaf0;margin:0 0 6px;}
  .master-lock-box p{font-size:12px;color:#8892a4;margin:0 0 18px;line-height:1.5;}
  .master-lock-box select, .master-lock-box input{width:100%;background:#1c2030;border:1.5px solid #252a3a;border-radius:8px;color:#e8eaf0;font-family:'Inter',sans-serif;font-size:14px;padding:11px;outline:none;margin-bottom:10px;}
  .master-lock-box button{width:100%;background:#c8a96e;color:#0d0f14;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;}
  .master-lock-box .lock-msg{font-size:12px;color:#e05252;margin-top:10px;min-height:16px;}
</style>
</head>
<body>
  <div class="master-lock" id="masterLock">
    <div class="master-lock-box">
      <div class="lock-icon">🔒</div>
      <h2>Moje realitní schůzky</h2>
      <p>Vyber své jméno a zadej svůj PIN z Týmu.</p>
      <select id="authSelect"><option value="">-- Vyber jméno --</option></select>
      <input type="password" id="authPinInput" inputmode="numeric" maxlength="6" placeholder="PIN">
      <button onclick="prihlasit()">Odemknout</button>
      <div class="lock-msg" id="lockMsg"></div>
    </div>
  </div>

  <div class="topbar">
    <div class="title">4fin // Moje realitní schůzky</div>
  </div>
  <div class="wrap">
    <h1>Moje realitní schůzky</h1>
    <div class="sub">Domluvené schůzky přidělené tobě. Až proběhne (nebo se nepotvrdí), zapiš sem výsledek.</div>
    <div id="content"><div class="empty">Načítám...</div></div>
  </div>

<script>
const TOKEN = '6696d0e4ae4d7f0d73530fbd67961aeb2d823f69';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyqnJsAlmzOAntypivM5oiLt8twpNJkJrUaK4D-rkvQPzFC_btwUrC8ivasYrnWbdsM6g/exec?token=' + TOKEN;
let SCHUZKY = [];
let AUTH_PERSON_ID = sessionStorage.getItem('rl_auth_personId') || '';
let AUTH_PIN = sessionStorage.getItem('rl_auth_pin') || '';

async function nactiTymDoVyberu(){
  try{
    const res = await fetch(SCRIPT_URL + '&action=getTym');
    const tym = await res.json();
    const sel = document.getElementById('authSelect');
    if (Array.isArray(tym)) {
      sel.innerHTML = '<option value="">-- Vyber jméno --</option>' +
        tym.filter(p=>p.aktivni).map(p=>`<option value="${p.personId}">${p.jmeno}</option>`).join('');
    }
  }catch(e){ console.log(e); }
}

async function prihlasit(){
  const personId = document.getElementById('authSelect').value;
  const pin = document.getElementById('authPinInput').value.trim();
  const msg = document.getElementById('lockMsg');
  if(!personId || !pin){ msg.textContent = 'Vyber jméno a zadej PIN.'; return; }
  msg.textContent = 'Ověřuji...';
  try{
    const res = await fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'prihlaseni', personId, pin })
    });
    const data = await res.json();
    if(data.ok){
      sessionStorage.setItem('rl_auth_personId', personId);
      sessionStorage.setItem('rl_auth_pin', pin);
      location.reload();
    } else {
      msg.textContent = 'Špatné jméno nebo PIN.';
    }
  }catch(e){ msg.textContent = 'Chyba připojení.'; console.log(e); }
}

async function nacti(){
  try{
    const res = await fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'getMojeRealitniSchuzky', auth_personId: AUTH_PERSON_ID, auth_pin: AUTH_PIN })
    });
    SCHUZKY = await res.json();
    if(!Array.isArray(SCHUZKY)) SCHUZKY = [];
  }catch(e){ SCHUZKY = []; console.log(e); }
  render();
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(){
  const el = document.getElementById('content');
  if(!SCHUZKY.length){
    el.innerHTML = '<div class="empty">Zatím nemáš přidělené žádné realitní schůzky.</div>';
    return;
  }
  const razene = [...SCHUZKY].sort((a,b)=>b.datumPridani.localeCompare(a.datumPridani));
  el.innerHTML = razene.map(s => `
    <div class="card" id="schuzka-${s.id}">
      <div class="c-name">${esc(s.klientJmeno)}</div>
      <div class="c-meta">📞 ${esc(s.telefon)}${s.email ? ' · ✉️ ' + esc(s.email) : ''}</div>
      ${s.datumSchuzky ? `<div class="c-meta">📅 Termín: ${esc(s.datumSchuzky)}</div>` : ''}
      ${s.makler ? `<div class="c-meta">Makléř: ${esc(s.makler)}</div>` : ''}
      ${s.poznamkaTelefonisty ? `<div class="c-note">${esc(s.poznamkaTelefonisty)}</div>` : ''}

      <div class="row">
        <div class="row-label">Klient schůzku potvrdil?</div>
        <div class="btn-group">
          <button class="btn-toggle ${s.potvrzeno==='ANO'?'selected-yes':''}" onclick="nastavPole('${s.id}','potvrzeno','ANO')">Ano</button>
          <button class="btn-toggle ${s.potvrzeno==='NE'?'selected-no':''}" onclick="nastavPole('${s.id}','potvrzeno','NE')">Ne</button>
        </div>
        ${s.potvrzeno==='NE' ? `<textarea placeholder="Proč nepotvrdil? (důvod)" onchange="nastavPole('${s.id}','duvodNepotvrzeni',this.value)">${esc(s.duvodNepotvrzeni)}</textarea>` : ''}
      </div>

      <div class="row">
        <div class="row-label">Schůzka se uskutečnila?</div>
        <div class="btn-group">
          <button class="btn-toggle ${s.uskutecnilaSe==='ANO'?'selected-yes':''}" onclick="nastavPole('${s.id}','uskutecnilaSe','ANO')">Ano</button>
          <button class="btn-toggle ${s.uskutecnilaSe==='NE'?'selected-no':''}" onclick="nastavPole('${s.id}','uskutecnilaSe','NE')">Ne</button>
        </div>
      </div>

      <div class="row">
        <div class="row-label">Byla z toho analýza?</div>
        <div class="btn-group">
          <button class="btn-toggle ${s.bylaAnalyza==='ANO'?'selected-yes':''}" onclick="nastavPole('${s.id}','bylaAnalyza','ANO')">Ano</button>
          <button class="btn-toggle ${s.bylaAnalyza==='NE'?'selected-no':''}" onclick="nastavPole('${s.id}','bylaAnalyza','NE')">Ne</button>
        </div>
      </div>

      ${s.uskutecnilaSe==='ANO' ? `
      <div class="row">
        <div class="row-label">Překlopilo se to na budoucí analýzu?</div>
        <div class="btn-group">
          <button class="btn-toggle ${s.budouciAnalyza==='ANO'?'selected-yes':''}" onclick="nastavPole('${s.id}','budouciAnalyza','ANO')">Ano</button>
          <button class="btn-toggle ${s.budouciAnalyza==='NE'?'selected-no':''}" onclick="nastavPole('${s.id}','budouciAnalyza','NE')">Ne</button>
        </div>
      </div>

      <div class="row">
        <div class="row-label">Počet obchodních bodů</div>
        <input type="number" min="0" value="${s.obchodniBody||0}" onchange="nastavPole('${s.id}','obchodniBody',this.value)">
      </div>
      ` : ''}

      <div class="status-line" id="status-${s.id}"></div>
    </div>
  `).join('');
}

async function nastavPole(id, pole, hodnota){
  const s = SCHUZKY.find(x => x.id === id);
  if(!s) return;
  s[pole] = hodnota;
  render();
  const statusEl = document.getElementById('status-'+id);
  if(statusEl) statusEl.textContent = 'Ukládám...';
  try{
    await fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({
        action:'aktualizovatRealitniSchuzku', auth_personId: AUTH_PERSON_ID, auth_pin: AUTH_PIN,
        id: s.id, potvrzeno: s.potvrzeno||'', duvodNepotvrzeni: s.duvodNepotvrzeni||'',
        uskutecnilaSe: s.uskutecnilaSe||'', bylaAnalyza: s.bylaAnalyza||'',
        budouciAnalyza: s.budouciAnalyza||'', obchodniBody: s.obchodniBody||0
      })
    });
    const statusEl2 = document.getElementById('status-'+id);
    if(statusEl2) statusEl2.textContent = 'Uloženo ✓';
  }catch(e){
    const statusEl3 = document.getElementById('status-'+id);
    if(statusEl3) statusEl3.textContent = 'Chyba ukládání, zkus znovu.';
    console.log(e);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (AUTH_PERSON_ID && AUTH_PIN) {
    document.getElementById('masterLock').style.display = 'none';
    nacti();
  } else {
    nactiTymDoVyberu();
  }
});
</script>
</body>
</html>
