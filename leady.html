<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f14">
<title>4fin | Leady</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --bg:#0d0f14;--surface:#151820;--surface2:#1c2030;
    --border:#252a3a;--accent:#c8a96e;--accent2:#e8c98e;
    --green:#4caf82;--red:#e05252;--yellow:#e0a832;--blue:#5b8dee;
    --text:#e8eaf0;--text2:#8892a4;--text3:#555f72;--r:12px;--mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;padding-bottom:60px;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px 12px;position:sticky;top:0;z-index:50;}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .back-btn{font-size:11px;color:var(--text3);text-decoration:none;font-family:var(--mono);}
  .header-title{font-size:20px;font-weight:700;color:var(--text);margin-top:2px;}
  .shell{max-width:700px;margin:0 auto;padding:20px 16px;}

  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;}
  .filter-btn{flex-shrink:0;background:var(--surface);border:1.5px solid var(--border);border-radius:20px;color:var(--text2);font-size:12px;font-weight:600;padding:8px 14px;cursor:pointer;white-space:nowrap;}
  .filter-btn.active{background:var(--accent);border-color:var(--accent);color:#0d0f14;}

  .empty{text-align:center;padding:50px 20px;color:var(--text3);}
  .empty-icon{font-size:40px;margin-bottom:12px;}

  .lead-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px;}
  .lead-card.assigned{opacity:0.55;}
  .lead-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .lead-name{font-size:15px;font-weight:700;color:var(--text);}
  .lead-badge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;flex-shrink:0;}
  .lead-badge.hypoteka{background:rgba(200,169,110,0.15);color:var(--accent);}
  .lead-badge.auto{background:rgba(91,141,238,0.15);color:var(--blue);}
  .lead-meta{font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:10px;}
  .lead-meta a{color:var(--text2);text-decoration:none;}
  .lead-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text3);margin-bottom:10px;}
  .lead-assigned-tag{font-size:11px;color:var(--green);font-weight:600;}

  .assign-row{display:flex;gap:8px;}
  .assign-row select{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:9px 10px;outline:none;}
  .btn-assign{background:var(--accent);color:#0d0f14;border:none;border-radius:8px;font-size:13px;font-weight:700;padding:9px 16px;cursor:pointer;white-space:nowrap;}
  .btn-assign:disabled{opacity:0.4;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#0d0f14;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<!-- ZÁMEK HESLEM -->
<div id="lockOverlay" style="position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;">
  <div style="font-size:32px;margin-bottom:16px;">🔒</div>
  <div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;">Modul Leady</div>
  <div style="font-size:13px;color:var(--text3);margin-bottom:20px;">Zadej heslo pro vstup</div>
  <input type="password" id="lockPassword" placeholder="Heslo" style="background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;padding:12px 14px;outline:none;width:240px;text-align:center;margin-bottom:12px;">
  <button onclick="checkLock()" style="background:var(--accent);color:#0d0f14;border:none;border-radius:8px;font-size:14px;font-weight:700;padding:11px 24px;cursor:pointer;width:240px;">Vstoupit</button>
  <div id="lockError" style="color:var(--red);font-size:12px;margin-top:10px;height:16px;"></div>
</div>

<header>
  <div class="header-top">
    <a href="index.html" class="back-btn">← 4fin OS</a>
  </div>
  <div class="header-title">Leady</div>
</header>

<div class="shell">
  <div class="filters">
    <button class="filter-btn active" data-f="vse" onclick="setFilter('vse',this)">Vše</button>
    <button class="filter-btn" data-f="nepridelene" onclick="setFilter('nepridelene',this)">Nepřidělené</button>
    <button class="filter-btn" data-f="hypoteka" onclick="setFilter('hypoteka',this)">Hypotéka</button>
    <button class="filter-btn" data-f="auto" onclick="setFilter('auto',this)">Auto</button>
  </div>
  <div id="list"><div style="text-align:center;color:var(--text3);padding:30px;">Načítám leady...</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyqnJsAlmzOAntypivM5oiLt8twpNJkJrUaK4D-rkvQPzFC_btwUrC8ivasYrnWbdsM6g/exec';

// Ověř si prosím e-maily konzultantů níže — u některých je e-mail odhadnutý podle vzoru,
// pokud se liší, uprav ho zde.
const CONSULTANTS = [
  {id:'truhlar',     name:'Truhlář, Luboš',    email:'lubos.truhlar@4fin.cz'},
  {id:'bugaeva',     name:'Bugaeva, Marina',   email:'marina.bugaeva@4fin.cz'},
  {id:'honcharenko', name:'Honcharenko, Olha', email:'olha.honcharenko@4fin.cz'},
  {id:'kruts',       name:'Kruts, Nataliia',   email:'natalia.kruts@4fin.cz'},
  {id:'moravcova',   name:'Moravcová, Tereza', email:'tereza.moravcova@4fin.cz'},
  {id:'zavrel',      name:'Zavřel, Radek',     email:'radek.zavrel@4fin.cz'},
  {id:'ershova',     name:'Ershova, Katka',    email:'ekaterina.ershova@4fin.cz'},
  {id:'manoilo',     name:'Manoilo, Oksana',   email:'oksana.manoilova@4fin.cz'},
  {id:'taran',       name:'Taran, Alina',      email:'alina.taran@4fin.cz'},
  {id:'glukhova',    name:'Glukhova, Iuliia',  email:'iuliia.glukhova@4fin.cz'},
  {id:'dubovych',    name:'Dubovych, Oleksandr', email:'oleksandr.dubovych@4fin.cz'},
  {id:'dubarets',    name:'Dubarets, Karyna',  email:'karyna.dubarets@4fin.cz'},
  {id:'kokrhoun',    name:'Kokrhoun, Vojtěch', email:'vojtech.kokrhoun@4fin.cz'},
  {id:'slouka',      name:'Slouka, Jan Max',   email:'jan.max.slouka@4fin.cz'},
  {id:'demchuk',     name:'Demchuk, Vitalii',  email:'vitalii.demchuk@4fin.cz'},
  {id:'fiedler',     name:'Fiedler, Filip',    email:'filip.fiedler@4fin.cz'},
  {id:'moroz',       name:'Moroz, Natalija',   email:'natalija.moroz@4fin.cz'}
];

// FIX: Referral kódy se už nedrží natvrdo v kódu — načítají se živě
// z listu ReferralKody (list je jediný zdroj pravdy, viz naplnitReferralKodyPocatecni
// v Kód.gs). REF_MAP se naplní až po načtení stránky, viz nactiLeady().
let REF_MAP = {};

async function nactiReferralKody() {
  try {
    const res = await fetch(SCRIPT_URL + '?action=getReferralKody');
    const rows = await res.json();
    const map = {};
    (rows || []).forEach(r => { if (r.kod) map[r.kod] = { name: r.jmeno || r.kod }; });
    REF_MAP = map;
  } catch(e) {
    console.log('Nepodařilo se načíst referral kódy:', e);
  }
}

let leady = [];
let curFilter = 'vse';

const LEADY_HESLO = '4finLeady2026';

function checkLock() {
  const zadane = document.getElementById('lockPassword').value;
  if (zadane === LEADY_HESLO) {
    localStorage.setItem('leady_unlocked', '1');
    document.getElementById('lockOverlay').style.display = 'none';
  } else {
    document.getElementById('lockError').textContent = 'Nesprávné heslo.';
  }
}
document.getElementById('lockPassword').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkLock();
});
if (localStorage.getItem('leady_unlocked') === '1') {
  document.getElementById('lockOverlay').style.display = 'none';
}

document.addEventListener('DOMContentLoaded', nactiLeady);

async function nactiLeady() {
  try {
    const [leadyRes] = await Promise.all([
      fetch(SCRIPT_URL + '?action=getLeady'),
      nactiReferralKody()
    ]);
    leady = await leadyRes.json();
  } catch(e) { leady = []; }
  render();
}

function setFilter(f, btn) {
  curFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const list = document.getElementById('list');
  let filtered = leady;
  if (curFilter === 'nepridelene') filtered = leady.filter(l => !l.prideleno);
  else if (curFilter === 'hypoteka' || curFilter === 'auto') filtered = leady.filter(l => l.typ === curFilter);

  filtered = filtered.slice().reverse(); // nejnovější první

  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div>Žádné leady k zobrazení.</div></div>`;
    return;
  }

  list.innerHTML = filtered.map(l => {
    const typLabel = l.typ === 'hypoteka' ? 'Hypotéka' : (l.typ === 'auto' ? 'Auto' : l.typ);
    const isAssigned = !!l.prideleno;
    return `<div class="lead-card ${isAssigned?'assigned':''}">
      <div class="lead-top">
        <div class="lead-name">${escHtml(l.jmeno)}</div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
          <div class="lead-badge ${l.typ}">${typLabel}</div>
          <button onclick="smazLeadKlik('${l.id}')" title="Smazat" style="background:rgba(224,82,82,0.15);border:1.5px solid var(--red);border-radius:8px;color:var(--red);font-size:14px;cursor:pointer;padding:6px 10px;">🗑</button>
        </div>
      </div>
      <div class="lead-meta">
        📞 <a href="tel:${escAttr(l.telefon)}">${escHtml(l.telefon)}</a>${l.email ? ' · <a href="mailto:'+escAttr(l.email)+'">'+escHtml(l.email)+'</a>' : ''}<br>
        ${l.poznamka ? escHtml(l.poznamka) + '<br>' : ''}
        <span style="color:var(--text3)">zdroj: ${escHtml(l.zdroj)}</span>
      </div>
      <div class="lead-foot">
        <span>${escHtml(l.datum)}${l.doporucil ? ' · doporučil: <strong style="color:var(--accent)">'+escHtml(REF_MAP[l.doporucil]?.name||l.doporucil)+'</strong>' : ''}</span>
        ${isAssigned ? `<span class="lead-assigned-tag">✓ ${escHtml(l.prideleno)}</span>` : ''}
      </div>
      ${!isAssigned ? `
      <div class="assign-row">
        <select id="sel-${l.id}">
          ${CONSULTANTS.map(c=>`<option value="${c.id}">${c.name.split(',')[0]}</option>`).join('')}
        </select>
        <button class="btn-assign" onclick="prideli('${l.id}')">Přiřadit</button>
      </div>` : ''}
    </div>`;
  }).join('');
}

async function smazLeadKlik(leadId) {
  if (!confirm('Opravdu smazat tento lead?')) return;
  try {
    const res = await fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'smazLead', leadId })
    });
    const data = await res.json();
    if (data && data.status === 'ok') {
      showToast('🗑 Lead smazán');
      await nactiLeady();
    } else {
      showToast('⚠️ Nepodařilo se smazat');
    }
  } catch(e) {
    showToast('⚠️ Chyba: ' + e.message);
  }
}

async function prideli(leadId) {
  const sel = document.getElementById('sel-'+leadId);
  const personId = sel.value;
  const c = CONSULTANTS.find(x => x.id === personId);
  const btn = sel.nextElementSibling;
  btn.disabled = true; btn.textContent = '⏳';

  try {
    const res = await fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'prideliLead', leadId, personId, personName: c.name, personEmail: c.email })
    });
    const data = await res.json();
    if (data && data.status === 'ok') {
      showToast('✅ Přiřazeno: ' + c.name.split(',')[0]);
      await nactiLeady();
    } else {
      showToast('⚠️ Nepodařilo se přiřadit');
      btn.disabled = false; btn.textContent = 'Přiřadit';
    }
  } catch(e) {
    showToast('⚠️ Chyba: ' + e.message);
    btn.disabled = false; btn.textContent = 'Přiřadit';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
