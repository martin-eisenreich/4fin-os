<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Party — 4fin OS</title>
<style>
  :root {
    --navy: #0d1729; --navy2: #0a1120; --gold: #e8ae2b;
    --text: #23242c; --muted: #8a8f9c; --border: #e2e4e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    background: #f4f5f7; color: var(--text);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px; }
  .card {
    background: #fff; border-radius: 16px; padding: 24px;
    margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  input, textarea {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 15px; margin-bottom: 10px; font-family: inherit;
  }
  .row3 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
  .row3 input { margin-bottom: 0; }
  button {
    background: var(--navy); color: #fff; border: none; border-radius: 10px;
    padding: 13px 20px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
  }
  button.secondary { background: #fff; color: var(--navy); border: 1px solid var(--border); width: auto; padding: 8px 14px; font-size: 13px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { flex: 1; text-align: center; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; background: #fff; border: 1px solid var(--border); }
  .tab.active { background: var(--navy); color: #fff; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .stat-box { background: var(--navy); color: #fff; border-radius: 12px; padding: 16px; text-align: center; }
  .stat-box .val { font-size: 28px; font-weight: 800; color: var(--gold); }
  .stat-box .label { font-size: 12px; opacity: 0.85; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
  .hist-item { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
  .hist-item .d { font-weight: 700; }
  .hist-item .m { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .hist-item .pdf-btn { margin-top: 8px; }
  #pdfCard { display: none; }
  @media print {
    body * { visibility: hidden; }
    #pdfCard, #pdfCard * { visibility: visible; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    #pdfCard { display: block; position: absolute; top: 0; left: 0; width: 100%; }
    @page { margin: 12mm; }
  }
  #pinScreen { max-width: 340px; margin: 80px auto; text-align: center; }
  .hidden { display: none; }
  .add-row-btn { background: #fff; color: var(--navy); border: 1px dashed var(--border); font-size: 13px; padding: 8px; margin-bottom: 14px; }
</style>
</head>
<body>

<div id="pinScreen" class="wrap">
  <h1>🏆 Call Party</h1>
  <p class="sub">Vyber jméno a zadej PIN (nebo master PIN)</p>
  <select id="jmenoSelect"><option value="">Načítám tým…</option></select>
  <input type="password" id="pinInput" inputmode="numeric" placeholder="PIN nebo master PIN">
  <button onclick="prihlasit()">Vstoupit</button>
  <p id="pinError" class="sub" style="color:#c0392b;"></p>
</div>

<div id="appScreen" class="wrap hidden">
  <div class="tabs">
    <div class="tab active" id="tabStats" onclick="prepniTab('stats')">Statistiky</div>
    <div class="tab" id="tabUpload" onclick="prepniTab('upload')">Nahrát výsledky</div>
    <div class="tab" id="tabHist" onclick="prepniTab('hist')">Historie</div>
  </div>

  <!-- STATISTIKY -->
  <div id="viewStats">
    <div class="card">
      <h1>Statistiky za celou dobu</h1>
      <div class="stat-grid">
        <div class="stat-box"><div class="val" id="statDovolani">–</div><div class="label">Dovolání celkem</div></div>
        <div class="stat-box"><div class="val" id="statSchuzky">–</div><div class="label">Schůzky celkem</div></div>
      </div>
      <table>
        <tr><th>Jméno</th><th>Volání</th><th>Dovolání</th><th>Schůzky</th><th>Úspěšnost</th></tr>
        <tbody id="statTableBody"></tbody>
      </table>
      <button class="secondary pdf-btn" style="margin-top:14px;" onclick="stahnoutStatistikyPdf()">⬇ Stáhnout PDF (aktuální stav)</button>
    </div>
  </div>

  <!-- NAHRÁT VÝSLEDKY -->
  <div id="viewUpload" class="hidden">
    <div class="card">
      <h1>Nahrát výsledky call party</h1>
      <p class="sub">Datum: <span id="dnesniDatum"></span></p>
      <input type="file" id="fotoInput" accept="image/*" capture="environment" onchange="zpracovatFotku(this)">
      <p class="sub" id="fotoMsg"></p>
      <div id="radkyContainer"></div>
      <button class="add-row-btn" onclick="pridatRadek()">+ Přidat osobu</button>
      <textarea id="popisInput" rows="3" placeholder="Popis / pár slov k dnešní call party (bude v mailu)"></textarea>
      <button onclick="odeslatVysledky()">Uložit a naplánovat mail</button>
      <p class="sub" id="uploadMsg"></p>
    </div>
  </div>

  <!-- HISTORIE -->
  <div id="viewHist" class="hidden">
    <div class="card">
      <h1>Historie po datech</h1>
      <div id="histList"></div>
    </div>
  </div>
</div>

<!-- Skrytá tisknutelná karta pro export do PDF (Ctrl+P → Uložit jako PDF) -->
<div id="pdfCard"></div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbyqnJsAlmzOAntypivM5oiLt8twpNJkJrUaK4D-rkvQPzFC_btwUrC8ivasYrnWbdsM6g/exec';
var APP_TOKEN = '6696d0e4ae4d7f0d73530fbd67961aeb2d823f69'; // stejný token jako ostatní moduly 4fin OS
var authPersonId = '';
var authPin = '';

function volatBackend(action, extra) {
  var body = Object.assign({ action: action, auth_personId: authPersonId, auth_pin: authPin }, extra || {});
  return fetch(API_URL + '?token=' + APP_TOKEN + '&master_pin=' + encodeURIComponent(authPin), {
    method: 'POST',
    body: JSON.stringify(body)
  }).then(function(r) { return r.json(); });
}

// Seznam jmen se načte přes veřejnou akci getTym (nepotřebuje auth_pin)
fetch(API_URL + '?action=getTym&token=' + APP_TOKEN)
  .then(function(r) { return r.json(); })
  .then(function(tym) {
    var sel = document.getElementById('jmenoSelect');
    sel.innerHTML = '<option value="">Vyber jméno…</option>';
    tym.filter(function(o) { return o.aktivni; }).forEach(function(o) {
      var opt = document.createElement('option');
      opt.value = o.personId;
      opt.innerText = o.jmeno;
      sel.appendChild(opt);
    });
  });

function prihlasit() {
  authPersonId = document.getElementById('jmenoSelect').value;
  authPin = document.getElementById('pinInput').value.trim();
  if (!authPersonId || !authPin) {
    document.getElementById('pinError').innerText = 'Vyber jméno a zadej PIN.';
    return;
  }
  volatBackend('getCallPartyStatistiky').then(function(res) {
    if (res.error || res.status !== 'ok') {
      document.getElementById('pinError').innerText = res.error || 'Chybný PIN nebo nemáš do modulu přístup.';
      return;
    }
    document.getElementById('pinScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    vykreslitStatistiky(res);
    document.getElementById('dnesniDatum').innerText = new Date().toLocaleDateString('cs-CZ');
    pridatRadek();
    nacistHistorii();
  });
}

function prepniTab(nazev) {
  ['stats','upload','hist'].forEach(function(t) {
    document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('hidden', t !== nazev);
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === nazev);
  });
}

var lastStats = null;
function vykreslitStatistiky(res) {
  lastStats = res;
  document.getElementById('statDovolani').innerText = res.celkem.dovolani;
  document.getElementById('statSchuzky').innerText = res.celkem.schuzky;
  var tbody = document.getElementById('statTableBody');
  tbody.innerHTML = '';
  res.lide.forEach(function(o) {
    tbody.innerHTML += '<tr><td>' + o.jmeno + '</td><td>' + o.volani + '</td><td>' + o.dovolani + '</td><td>' + o.schuzky + '</td><td>' + o.uspesnost + '%</td></tr>';
  });
  tbody.innerHTML += '<tr style="font-weight:800;"><td>Tým celkem</td><td>' + res.celkem.volani + '</td><td>' + res.celkem.dovolani + '</td><td>' + res.celkem.schuzky + '</td><td>' + res.celkem.uspesnost + '%</td></tr>';
}

function pridatRadek(hodnoty) {
  var div = document.createElement('div');
  div.className = 'row3';
  div.innerHTML =
    '<input placeholder="Jméno" class="jmeno">' +
    '<input placeholder="Volání" type="number" class="volani">' +
    '<input placeholder="Dovolání" type="number" class="dovolani">' +
    '<input placeholder="Schůzky" type="number" class="schuzky">' +
    '<button class="secondary" onclick="this.parentElement.remove()">✕</button>';
  document.getElementById('radkyContainer').appendChild(div);
  if (hodnoty) {
    div.querySelector('.jmeno').value = hodnoty.jmeno || '';
    div.querySelector('.volani').value = hodnoty.volani || '';
    div.querySelector('.dovolani').value = hodnoty.dovolani || '';
    div.querySelector('.schuzky').value = hodnoty.schuzky || '';
  }
}

function zpracovatFotku(input) {
  var soubor = input.files[0];
  if (!soubor) return;
  var msg = document.getElementById('fotoMsg');
  msg.innerText = 'Čtu fotku…';
  var reader = new FileReader();
  reader.onload = function() {
    var base64 = reader.result.split(',')[1];
    volatBackend('cpAnalyzovatFotku', { imageBase64: base64, mimeType: soubor.type }).then(function(res) {
      if (res.status !== 'ok') {
        msg.innerText = res.message || 'Fotku se nepodařilo přečíst, zadej prosím ručně.';
        return;
      }
      document.getElementById('radkyContainer').innerHTML = '';
      res.radky.forEach(function(r) { pridatRadek(r); });
      msg.innerText = 'Načteno z fotky — zkontroluj čísla a uprav, co nesedí.';
    });
  };
  reader.readAsDataURL(soubor);
}

function odeslatVysledky() {
  var radky = [];
  document.querySelectorAll('#radkyContainer .row3').forEach(function(row) {
    var jmeno = row.querySelector('.jmeno').value.trim();
    if (!jmeno) return;
    radky.push({
      jmeno: jmeno,
      volani: row.querySelector('.volani').value || 0,
      dovolani: row.querySelector('.dovolani').value || 0,
      schuzky: row.querySelector('.schuzky').value || 0
    });
  });
  if (radky.length === 0) {
    document.getElementById('uploadMsg').innerText = 'Přidej aspoň jednu osobu.';
    return;
  }
  var datum = new Date().toISOString().slice(0, 10);
  var popis = document.getElementById('popisInput').value;
  volatBackend('ulozitCallParty', { datum: datum, radky: radky, popis: popis }).then(function(res) {
    document.getElementById('uploadMsg').innerText = res.status === 'ok'
      ? 'Uloženo. Mail týmu odejde zítra ve 20:00.'
      : (res.error || res.message || 'Chyba při ukládání.');
    if (res.status === 'ok') {
      volatBackend('getCallPartyStatistiky').then(vykreslitStatistiky);
      nacistHistorii();
    }
  });
}

function nacistHistorii() {
  volatBackend('getCallPartyHistorie').then(function(res) {
    if (res.status !== 'ok') return;
    var list = document.getElementById('histList');
    list.innerHTML = '';
    res.historie.forEach(function(den) {
      var celkem = den.radky.reduce(function(a, r) { a.s += Number(r.schuzky); return a; }, { s: 0 });
      var div = document.createElement('div');
      div.className = 'hist-item';
      div.innerHTML = '<div class="d">' + den.datum + '</div><div class="m">' + den.radky.length + ' účastníků · ' + celkem.s + ' schůzek celkem</div>' +
        '<button class="secondary pdf-btn" onclick="event.stopPropagation(); stahnoutPdf(\'' + den.datum + '\')">⬇ Stáhnout PDF</button>';
      list.appendChild(div);
    });
  });
}

var CP_ASSET_BASE_HTML = 'https://martin-eisenreich.github.io/4fin-os/assets/callparty/';

function stahnoutStatistikyPdf() {
  if (!lastStats) return;
  var dnes = new Date().toLocaleDateString('cs-CZ');

  var radkyHtml = lastStats.lide.map(function(o, i) {
    var bg = i % 2 === 0 ? '#ffffff' : '#f0f0f0';
    return '<tr style="background:' + bg + ';">' +
      '<td style="padding:12px 18px;font-weight:700;">' + o.jmeno + '</td>' +
      '<td style="padding:12px 18px;text-align:center;">' + o.volani + '</td>' +
      '<td style="padding:12px 18px;text-align:center;">' + o.dovolani + '</td>' +
      '<td style="padding:12px 18px;text-align:center;">' + o.schuzky + '</td>' +
      '<td style="padding:12px 18px;text-align:center;">' + o.uspesnost + '%</td></tr>';
  }).join('');

  document.getElementById('pdfCard').innerHTML =
    '<div style="max-width:680px;margin:20px auto;font-family:Arial,sans-serif;">' +
    '  <div style="background:#0d1729;border-radius:16px 16px 0 0;padding:24px 28px;">' +
    '    <img src="' + CP_ASSET_BASE_HTML + 'trophy_title.png" width="40" style="vertical-align:middle;margin-right:14px;">' +
    '    <span style="color:#fff;font-size:20px;font-weight:800;letter-spacing:0.5px;vertical-align:middle;">CALL PARTY — CELKOVÁ STATISTIKA</span>' +
    '    <div style="color:#8892a4;font-size:13px;margin-top:6px;margin-left:54px;">Stav k ' + dnes + '</div>' +
    '  </div>' +
    '  <table width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;border:2px solid #e8ae2b;border-top:none;">' +
    '    <tr style="background:#0d1729;"><th style="padding:12px 18px;text-align:left;color:#fff;">JMÉNO</th><th style="padding:12px 18px;color:#fff;">VOLÁNÍ</th><th style="padding:12px 18px;color:#fff;">DOVOLÁNÍ</th><th style="padding:12px 18px;color:#fff;">SCHŮZKY</th><th style="padding:12px 18px;color:#fff;">ÚSPĚŠNOST</th></tr>' +
         radkyHtml +
    '    <tr style="background:#0d1729;"><td style="padding:12px 18px;color:#fff;font-weight:800;">TÝM CELKEM</td>' +
    '      <td style="padding:12px 18px;text-align:center;color:#e8ae2b;font-weight:800;">' + lastStats.celkem.volani + '</td>' +
    '      <td style="padding:12px 18px;text-align:center;color:#e8ae2b;font-weight:800;">' + lastStats.celkem.dovolani + '</td>' +
    '      <td style="padding:12px 18px;text-align:center;color:#e8ae2b;font-weight:800;">' + lastStats.celkem.schuzky + '</td>' +
    '      <td style="padding:12px 18px;text-align:center;color:#e8ae2b;font-weight:800;">' + lastStats.celkem.uspesnost + '%</td></tr>' +
    '  </table>' +
    '</div>';

  setTimeout(function() { cpSpustitTisk(); }, 50);
}

function cpSpustitTisk() {
  var obrazky = document.querySelectorAll('#pdfCard img');
  var cekam = Array.prototype.map.call(obrazky, function(img) {
    return img.complete ? Promise.resolve() : new Promise(function(res) { img.onload = img.onerror = res; });
  });
  Promise.all(cekam).then(function() { window.print(); });
}

function stahnoutPdf(datum) {
  volatBackend('getCallPartyHistorie').then(function(res) {
    if (res.status !== 'ok') return;
    var den = res.historie.find(function(d) { return d.datum === datum; });
    if (!den) return;

    var celkem = den.radky.reduce(function(a, r) {
      a.volani += Number(r.volani); a.dovolani += Number(r.dovolani); a.schuzky += Number(r.schuzky);
      return a;
    }, { volani: 0, dovolani: 0, schuzky: 0 });

    var vitez = den.radky.slice().sort(function(a, b) {
      if (b.schuzky !== a.schuzky) return b.schuzky - a.schuzky;
      var uA = a.dovolani > 0 ? a.schuzky / a.dovolani : 0, uB = b.dovolani > 0 ? b.schuzky / b.dovolani : 0;
      return uB - uA;
    })[0];

    var radkyHtml = den.radky.map(function(r, i) {
      var bg = i % 2 === 0 ? '#ffffff' : '#f0f0f0';
      var barva = r.jmeno === vitez.jmeno ? '#e8ae2b' : '#23242c';
      return '<tr style="background:' + bg + ';">' +
        '<td style="padding:14px 20px;font-weight:700;color:' + barva + ';">' + r.jmeno + '</td>' +
        '<td style="padding:14px 20px;text-align:center;">' + r.volani + '</td>' +
        '<td style="padding:14px 20px;text-align:center;">' + r.dovolani + '</td>' +
        '<td style="padding:14px 20px;text-align:center;">' + r.schuzky + '</td></tr>';
    }).join('');

    document.getElementById('pdfCard').innerHTML =
      '<div style="max-width:640px;margin:20px auto;font-family:Arial,sans-serif;">' +
      '  <div style="background:#0d1729;border-radius:16px 16px 0 0;padding:24px 28px;">' +
      '    <img src="' + CP_ASSET_BASE_HTML + 'trophy_title.png" width="40" style="vertical-align:middle;margin-right:14px;">' +
      '    <span style="color:#fff;font-size:20px;font-weight:800;letter-spacing:0.5px;vertical-align:middle;">VÝSLEDKY CALL PARTY — ' + datum + '</span>' +
      '  </div>' +
      '  <table width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;border:2px solid #e8ae2b;border-top:none;">' +
      '    <tr style="background:#0d1729;"><th style="padding:14px 20px;text-align:left;color:#fff;">JMÉNO</th><th style="padding:14px 20px;color:#fff;">VOLÁNÍ</th><th style="padding:14px 20px;color:#fff;">ÚSPĚŠNÉ HOVORY</th><th style="padding:14px 20px;color:#fff;">SCHŮZKY</th></tr>' +
           radkyHtml +
      '    <tr style="background:#0d1729;"><td style="padding:14px 20px;color:#fff;font-weight:800;">CELKEM</td><td style="padding:14px 20px;text-align:center;color:#e8ae2b;font-weight:800;">' + celkem.volani + '</td><td style="padding:14px 20px;text-align:center;color:#e8ae2b;font-weight:800;">' + celkem.dovolani + '</td><td style="padding:14px 20px;text-align:center;color:#e8ae2b;font-weight:800;">' + celkem.schuzky + '</td></tr>' +
      '  </table>' +
      '  <div style="background:#0d1729;border:2px solid #e8ae2b;border-top:none;border-radius:0 0 16px 16px;padding:20px 28px;">' +
      '    <table><tr><td><img src="' + CP_ASSET_BASE_HTML + 'winner_trophy.png" width="100"></td>' +
      '      <td style="padding-left:20px;"><div style="color:#fff;font-size:16px;font-weight:700;">VÍTĚZ CALL PARTY:</div>' +
      '      <div style="color:#e8ae2b;font-size:32px;font-weight:900;">' + vitez.jmeno + '!</div></td></tr></table>' +
      (den.meta.popis ? '<p style="color:#fff;font-size:14px;margin-top:16px;">' + den.meta.popis + '</p>' : '') +
      '  </div>' +
      '</div>';

    setTimeout(function() { cpSpustitTisk(); }, 50);
  });
}
</script>
</body>
</html>
