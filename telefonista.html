<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4fin | Telefonista</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --bg:#0d0f14; --surface:#151820; --surface2:#1c2030; --border:#252a3a;
    --text:#e8eaf0; --text2:#8892a4; --text3:#555f72;
    --accent:#c8a96e; --green:#4caf82; --red:#e05252; --blue:#5b8dee; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10;}
  .topbar .title{font-family:var(--mono);color:var(--accent);font-size:13px;letter-spacing:0.05em;}
  .topbar .count{font-family:var(--mono);color:var(--text2);font-size:13px;}
  .wrap{max-width:600px;margin:0 auto;padding:20px 16px 80px;}
  .empty{text-align:center;color:var(--text2);padding:60px 20px;font-size:14px;line-height:1.7;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;}
  .card-name{font-size:17px;font-weight:700;margin-bottom:4px;}
  .card-phone{font-family:var(--mono);font-size:16px;color:var(--accent);text-decoration:none;display:inline-block;margin-bottom:10px;}
  .card-meta{font-size:12px;color:var(--text2);margin-bottom:4px;line-height:1.6;}
  .card-info{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text);margin:10px 0;line-height:1.6;}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
  .btn{border:1.5px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:12px 10px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;}
  .btn:active{opacity:0.7;}
  .btn-domluveno{grid-column:1/-1;background:rgba(76,175,130,0.15);border-color:rgba(76,175,130,0.4);color:var(--green);}
  .domluveno-form{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .domluveno-form.open{display:block;}
  .domluveno-form label{display:block;font-size:11px;color:var(--text3);margin-bottom:4px;margin-top:10px;}
  .domluveno-form input, .domluveno-form textarea{
    width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:6px;color:var(--text);
    font-family:'Inter',sans-serif;font-size:14px;padding:9px 10px;outline:none;
  }
  .domluveno-form textarea{min-height:50px;resize:vertical;}
  .domluveno-form .submit-row{display:flex;gap:8px;margin-top:12px;}
  .domluveno-form .submit-row .btn{flex:1;}
  .btn-submit{background:var(--green);color:var(--bg);border-color:var(--green);}
  .poznamka-inline{display:none;margin-top:10px;}
  .poznamka-inline.open{display:block;}
  .poznamka-inline textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:8px 10px;outline:none;min-height:40px;margin-top:6px;}
  .master-lock{position:fixed;inset:0;background:#0d0f14;z-index:9999;display:flex;align-items:center;justify-content:center;}
  .master-lock-box{background:#151820;border:1px solid #252a3a;border-radius:14px;padding:32px 28px;max-width:340px;width:90%;text-align:center;}
  .master-lock-box .lock-icon{font-size:32px;margin-bottom:12px;}
  .master-lock-box h2{font-size:16px;color:#e8eaf0;margin:0 0 6px;}
  .master-lock-box p{font-size:12px;color:#8892a4;margin:0 0 18px;line-height:1.5;}
  .master-lock-box input{width:100%;background:#1c2030;border:1.5px solid #252a3a;border-radius:8px;color:#e8eaf0;font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:0.3em;text-align:center;padding:12px;outline:none;margin-bottom:12px;}
  .master-lock-box input:focus{border-color:#c8a96e;}
  .master-lock-box button{width:100%;background:#c8a96e;color:#0d0f14;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;}
  .master-lock-box .lock-msg{font-size:12px;color:#e05252;margin-top:10px;min-height:16px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;opacity:0;transition:all 0.3s;pointer-events:none;z-index:1000;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
  <div class="master-lock" id="masterLock">
    <div class="master-lock-box">
      <div class="lock-icon">🔒</div>
      <h2>Telefonista</h2>
      <p>Zadej svůj PIN.</p>
      <input type="password" id="masterPinInput" inputmode="numeric" maxlength="12" placeholder="PIN" autofocus>
      <button onclick="prihlasitTelefonistu()">Odemknout</button>
      <div class="lock-msg" id="masterLockMsg"></div>
    </div>
  </div>

  <div class="topbar">
    <div class="title">4fin // Telefonista</div>
    <div class="count" id="pocetKontaktu">—</div>
  </div>
  <div class="wrap" id="content">
    <div class="empty">Načítám...</div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyqnJsAlmzOAntypivM5oiLt8twpNJkJrUaK4D-rkvQPzFC_btwUrC8ivasYrnWbdsM6g/exec?token=6696d0e4ae4d7f0d73530fbd67961aeb2d823f69' + (sessionStorage.getItem('telefonista_pin_4fin') ? '&telefonista_pin=' + encodeURIComponent(sessionStorage.getItem('telefonista_pin_4fin')) : '');
let KONTAKTY = [];

function showToast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function nacti(){
  document.getElementById('content').innerHTML = '<div class="empty">Načítám...</div>';
  try{
    const res = await fetch(SCRIPT_URL + '&action=getKontaktyProTelefonistu');
    KONTAKTY = await res.json();
    if(!Array.isArray(KONTAKTY)) KONTAKTY = [];
  }catch(e){ KONTAKTY = []; console.log(e); }
  render();
}

function render(){
  document.getElementById('pocetKontaktu').textContent = KONTAKTY.length + ' čeká';
  const el = document.getElementById('content');
  if(!KONTAKTY.length){
    el.innerHTML = '<div class="empty">🎉 Žádné kontakty nečekají na zavolání.<br>Vrať se sem, až přibydou nové.</div>';
    return;
  }
  el.innerHTML = KONTAKTY.map((k,i) => `
    <div class="card" id="card-${i}">
      <div class="card-name">${esc(k.jmeno)}</div>
      <a class="card-phone" href="tel:${esc(k.telefon)}">${esc(k.telefon)}</a>
      ${k.email ? `<div class="card-meta">✉️ ${esc(k.email)}</div>` : ''}
      ${k.makler ? `<div class="card-meta">Makléř: ${esc(k.makler)}</div>` : ''}
      ${k.informace ? `<div class="card-info">${esc(k.informace)}</div>` : ''}

      <div class="btn-row">
        <button class="btn" onclick="rychlyVysledek(${i}, 'nezveda')">Nezvedá</button>
        <button class="btn" onclick="rychlyVysledek(${i}, 'nezajem')">Nezájem</button>
        <button class="btn" onclick="rychlyVysledek(${i}, 'spatne_cislo')">Špatné číslo</button>
        <button class="btn" onclick="rychlyVysledek(${i}, 'zavolat_pozdeji')">Zavolat později</button>
        <button class="btn btn-domluveno" onclick="toggleDomluveno(${i})">✅ Domluveno — schůzka</button>
      </div>

      <div class="domluveno-form" id="domform-${i}">
        <label>Datum a čas schůzky</label>
        <input type="datetime-local" id="dom-datum-${i}">
        <label>Poznámka (nepovinné)</label>
        <textarea id="dom-poznamka-${i}" placeholder="Cokoliv důležitého pro poradce..."></textarea>
        <div class="submit-row">
          <button class="btn btn-submit" onclick="odeslatDomluveno(${i})">Uložit schůzku</button>
        </div>
      </div>
    </div>
  `).join('');
}

function toggleDomluveno(i){
  document.getElementById('domform-'+i).classList.toggle('open');
}

async function rychlyVysledek(i, stav){
  const k = KONTAKTY[i];
  const card = document.getElementById('card-'+i);
  card.style.opacity = '0.4';
  try{
    await fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'ulozitVysledekVolani', telefonNorm: k.telefonNorm, stav: stav })
    });
    showToast('Uloženo ✓');
    KONTAKTY.splice(i,1);
    render();
  }catch(e){ card.style.opacity='1'; showToast('Chyba připojení, zkus znovu'); console.log(e); }
}

async function odeslatDomluveno(i){
  const k = KONTAKTY[i];
  const datum = document.getElementById('dom-datum-'+i).value;
  const poznamka = document.getElementById('dom-poznamka-'+i).value.trim();
  if(!datum){ showToast('Zadej prosím datum a čas schůzky.'); return; }
  const card = document.getElementById('card-'+i);
  card.style.opacity = '0.4';
  try{
    const res = await fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'ulozitVysledekVolani', telefonNorm: k.telefonNorm, stav:'domluveno', datumSchuzky: datum, poznamka })
    });
    const data = await res.json();
    showToast(data.pridelenoKomu ? ('Schůzka uložena, přidělena: ' + data.pridelenoKomu) : 'Schůzka uložena ✓');
    KONTAKTY.splice(i,1);
    render();
  }catch(e){ card.style.opacity='1'; showToast('Chyba připojení, zkus znovu'); console.log(e); }
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('telefonista_pin_4fin')) {
    document.getElementById('masterLock').style.display = 'none';
    nacti();
  }
});

async function prihlasitTelefonistu(){
  const pin = document.getElementById('masterPinInput').value.trim();
  const msg = document.getElementById('masterLockMsg');
  if(!pin){ msg.textContent = 'Zadej PIN.'; return; }
  msg.textContent = 'Ověřuji...';
  try{
    const baseUrl = SCRIPT_URL.split('&telefonista_pin=')[0];
    const res = await fetch(baseUrl, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({action:'prihlaseniTelefonista', pin})
    });
    const data = await res.json();
    if(data.ok){
      sessionStorage.setItem('telefonista_pin_4fin', pin);
      location.reload();
    } else {
      msg.textContent = 'Špatný PIN.';
    }
  }catch(e){ msg.textContent = 'Chyba připojení.'; console.log(e); }
}
</script>
</body>
</html>
